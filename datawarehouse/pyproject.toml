[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-dw"
version = "1.0.0"
description = "AWS E-commerce Data Warehouse Pipeline"
requires-python = ">=3.10"
dependencies = [
    "PyMySQL>=1.1.1,<2",
    "pymongo>=4.10,<5",
    "boto3>=1.36,<2",
    "psycopg2-binary>=2.9,<3",
    "Faker>=30,<40",
]

[project.scripts]
aws-dw = "aws_dw.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ecommerce_dw.sources" = ["mysql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.dbt]
profile = "ecommerce_dw"